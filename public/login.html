<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Sign in · EV Charging Monitoring</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
  <link href="/css/style.css" rel="stylesheet">
</head>
<body class="d-flex align-items-center" style="min-height:100vh;background:linear-gradient(140deg,#10192b,#0b63f6)">
  <main class="container" style="max-width:420px">
    <div class="card p-4">
      <div class="d-flex align-items-center gap-2 mb-3">
        <i class="bi bi-ev-station-fill fs-3" style="color:var(--ev-blue)"></i>
        <div>
          <h1 class="h5 mb-0">EV Charging Monitoring</h1>
          <p class="text-muted-sm mb-0">Station and charger health, live</p>
        </div>
      </div>

      <div id="loginError" class="alert alert-danger py-2 d-none" role="alert"></div>

      <div class="mb-3">
        <label for="email" class="form-label">Email</label>
        <input id="email" type="email" class="form-control" autocomplete="username" value="admin@evmonitor.com">
      </div>
      <div class="mb-3">
        <label for="password" class="form-label">Password</label>
        <input id="password" type="password" class="form-control" autocomplete="current-password" value="Admin@12345">
      </div>
      <button id="loginBtn" class="btn btn-primary w-100">Sign in</button>

      <details class="mt-3">
        <summary class="text-muted-sm">Demo accounts</summary>
        <ul class="text-muted-sm mt-2 mb-0 ps-3">
          <li>admin@evmonitor.com / Admin@12345</li>
          <li>operator@evmonitor.com / Operator@123</li>
          <li>viewer@evmonitor.com / Viewer@12345</li>
        </ul>
      </details>
    </div>
  </main>

  <script src="/js/api.js"></script>
  <script>
    const errorBox = document.getElementById('loginError');
    const button = document.getElementById('loginBtn');

    async function signIn() {
      errorBox.classList.add('d-none');
      button.disabled = true;
      button.textContent = 'Signing in…';
      try {
        const data = await api.post('/api/auth/login', {
          email: document.getElementById('email').value.trim(),
          password: document.getElementById('password').value
        });
        localStorage.setItem('ev_token', data.token);
        localStorage.setItem('ev_user', JSON.stringify(data.user));
        location.href = '/dashboard.html';
      } catch (err) {
        errorBox.textContent = err.message;
        errorBox.classList.remove('d-none');
      } finally {
        button.disabled = false;
        button.textContent = 'Sign in';
      }
    }

    button.addEventListener('click', signIn);
    document.addEventListener('keydown', (e) => { if (e.key === 'Enter') signIn(); });
  </script>
</body>
</html>
